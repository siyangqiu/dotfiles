# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

# --- Window ---
background_opacity 1.0
confirm_os_window_close 0

# --- Cursor ---
cursor             #D4D4D4
cursor_text_color  #1E1E1E
cursor_shape       block
cursor_blink_interval 0.5

# --- Selection ---
selection_background #3A3D41
selection_foreground #D4D4D4

# --- Primary colors ---
foreground #D4D4D4
background #1E1E1E

# --- Normal colors ---
color0  #1E1E1E
color1  #F44747
color2  #6A9955
color3  #DCDCAA
color4  #569CD6
color5  #C586C0
color6  #4EC9B0
color7  #D4D4D4

# --- Bright colors ---
color8  #3A3D41
color9  #F44747
color10 #6A9955
color11 #DCDCAA
color12 #569CD6
color13 #C586C0
color14 #4EC9B0
color15 #FFFFFF

# --- URL color ---
url_color #569CD6

# --- Tab bar (optional, closer to VS Code) ---
active_tab_background   #1E1E1E
active_tab_foreground   #D4D4D4
inactive_tab_background #252526
inactive_tab_foreground #858585

shell_integration enabled