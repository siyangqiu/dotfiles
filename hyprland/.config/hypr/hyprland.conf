
#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#


# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=DP-3, 3840x2160@144, 0x0, 1.5
monitor=DP-2, 3840x2160, 2560x0, 1.5
workspace=1,monitor:DP-3


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = waybar & hyprpaper & /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    blur = yes
    blur_size = 5
    blur_passes = 1
    blur_new_optimizations = on

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = yes
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic-mouse-v1 {
    sensitivity = -0.5
}

# Example windowrule v1
windowrulev2 = opacity 0.7 0.6,class:^(kitty)$
windowrulev2 = opacity 0.8 0.7,class:^(chromium)$
windowrulev2 = opacity 0.95. 0.9,class:^(code-oss)$
windowrulev2 = opacity 0.9 0.8,class:^(firefox)$
windowrulev2 = opacity 0.9 0.8,class:^(Thunar)$
windowrulev2 = opacity 0.95 0.9,class:^(thunar)$
windowrulev2 = opacity 0.9 0.8,class:^(discord)$
windowrulev2 = opacity 0.95 0.9,class:^(file-roller)$
windowrulev2 = opacity 0.95 0.9,class:^(qalculate-gtk)$
windowrulev2 = float,class:^(qalculate-gtk)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = move 1854 35,class:^(blueman-manager)$
windowrulev2 = size 700 600,class:^(blueman-manager)$
windowrulev2 = stayfocused,class:^(blueman-manager)$
windowrulev2 = opacity 0.9 0.9,class:^(pavucontrol)$
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = move 1854 35,class:^(pavucontrol)$
windowrulev2 = size 700 600,class:^(pavucontrol)$
windowrulev2 = stayfocused,class:^(pavucontrol)$
windowrulev2 = opacity 0.8 0.7,class:^(soffice.bin)$
windowrulev2 = opacity 0.8 0.7,class:^(oosplash)$
windowrulev2 = bordersize 50,xwayland:1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Application Binds
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, F, fullscreen, 1
bind = $mainMod CTRL, F, fullscreen, 0
bind = $mainMod ALT, F, fakefullscreen
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, R, exec, rofi -show run
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, V, togglesplit, # dwindle

bind = , Print, exec, grim ~/Screenshots/time.png

bindn = , Escape, closewindow,^(pavucontrol)$
bindn = , Escape, closewindow,^(blueman-manager)$
bindn = , Escape, closewindow,^(qalculate-gtk)$

bind = $mainMod, O, toggleopaque

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = ALT, tab, focusurgentorlast 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging-
bindm = $mainMod, mouse:272, movewindow

# Start submap called adjustment
bind = $mainMod, A, exec, hyprctl keyword general:gaps_out 100
bind = $mainMod, A, submap, adjustment
submap = adjustment

bind = $mainMod, F, togglefloating, 

# Resize Windows with Shift and Swap with CTRL
binde = , left, resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

# Swap windows with keyboard
bind = ALT, left, swapwindow, l
bind = ALT, right, swapwindow, r
bind = ALT, up, swapwindow, u
bind = ALT, down, swapwindow, d

# Move windows with keyboard
bind = CTRL, left, movewindow, l
bind = CTRL, right, movewindow, r
bind = CTRL, up, movewindow, u
bind = CTRL, down, movewindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move/resize windows with mainMod + LMB/RMB and dragging-
bindm = , mouse:272, movewindow
bindm = , mouse:273, resizewindow

bindn = , escape, exec, hyprctl keyword general:gaps_out 4
bind = , escape, submap, reset 
submap = reset

# Scroll through workspaces with keyboard
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left, workspace, e-1

# XF86 Bindings
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrevious, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86HomePage, exec, firefox -new-tab https://messenger.com
bind = , XF86Mail, exec, geary 
bind = , XF86Calculator, exec, qalculate-gtk
bind = , XF86Tools, exec, firefox -new-tab https://music.youtube.com/
