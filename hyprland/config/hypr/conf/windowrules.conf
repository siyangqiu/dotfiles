# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

windowrulev2 = workspace 1, onworkspace:s[1], class:negative:xdg-desktop-portal-gtk
windowrule = workspace special:browser silent, class:app.zen_browser.zen
windowrule = workspace special:code silent, class:code
windowrule = float, class:^(xdg-desktop-portal.*)$
windowrule = float, class:org.pulseaudio.pavucontrol